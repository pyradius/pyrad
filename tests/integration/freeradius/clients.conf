# FreeRADIUS clients used by the pyrad integration tests.
client localhost {
	ipaddr = 127.0.0.1
	secret = testing123
	shortname = pyrad
}

client localhost_ipv6 {
	ipv6addr = ::1
	secret = testing123
	shortname = pyrad6
}

# BlastRADIUS countermeasures: drop Access-Requests without
# Message-Authenticator and with Proxy-State from a non-proxy client.
client strict {
	ipaddr = 127.0.0.2
	secret = testing123
	shortname = pyrad-strict
	require_message_authenticator = yes
	limit_proxy_state = yes
}
