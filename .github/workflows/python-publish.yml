# Build the package and upload it to PyPI when a release is published on
# GitHub, with PyPI trusted publishing: PyPI trusts this workflow, so no API
# token or password is stored in GitHub.
# https://docs.pypi.org/trusted-publishers/

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7
    - name: Build package
      run: uv build
    # the release tag (e.g. 3.0.0 or v3.0.0) must match pyrad.__version__
    - name: Check the version
      run: |
        version="${GITHUB_REF_NAME#v}"
        test -f "dist/pyrad-${version}.tar.gz"
        test -f "dist/pyrad-${version}-py3-none-any.whl"
    - name: Store the packages
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # the environment configured for the trusted publisher on PyPI
    environment:
      name: pypi
      url: https://pypi.org/p/pyrad
    permissions:
      # for the OpenID Connect token PyPI verifies
      id-token: write
    steps:
    - name: Download the packages
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
